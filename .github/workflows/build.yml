name: Build Atrium Overlay

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build index.html
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: npm run build

      - name: Commit generated page
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Build Atrium overlay" || echo "No changes"
          git push
